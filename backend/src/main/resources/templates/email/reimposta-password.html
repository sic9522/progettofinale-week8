<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
	<p>Ciao <span th:text="${nome}">nome</span>,</p>
	<p>hai chiesto di reimpostare la password. Clicca sul link qui sotto per sceglierne una nuova:</p>
	<p><a th:href="${link}" th:text="${link}">link</a></p>
	<p>Se non sei stato tu, ignora questa email: la tua password resta invariata.</p>
	<p>Il link scade tra 30 minuti.</p>
</body>
</html>
